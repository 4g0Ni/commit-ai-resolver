[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CampaignUIMCPToolsPython"
version = "0.1.0"
description = "Python setup for some of the MCP tools"
authors = [{ name = "Your Name", email = "kalaksh@microsoft.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "mcp[cli]>=1.9.1",
    "httpx>=0.28.1",
    "azure-devops>=7.1.0b4",
    "msal>=1.32.3",
    "azure-identity>=1.23.0",
    "gitpython>=3.1.44",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "black"]
